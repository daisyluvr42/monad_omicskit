[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monadomics"
version = "0.2.2"
description = "Local R-backed bioinformatics workflows for WorkBuddy"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "MonadOmics"}]
keywords = ["bioinformatics", "omics", "workbuddy", "bioconductor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/daisyluvr42/monad_omicskit"

[project.scripts]
monadomics = "monadomics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monadomics = ["r/*.R", "r/lib/*.R"]
